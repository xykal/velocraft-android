name: Build Official Signed Xyverse Minecraft APK (id.xyverse.minecraft) + Draft Release

# =======================================================================================
# SECURITY POLICY FOR PUBLIC REPO:
# 1. NO `pull_request` or `pull_request_target` triggers -> External forks CANNOT trigger builds.
# 2. Only `push` to `main` (requires write token) or manual `workflow_dispatch` (requires write/admin token).
# 3. Releases are strictly created as DRAFT (`draft: true`) so only the repo owner can review & publish.
# =======================================================================================
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag versi untuk Draft Release"
        required: false
        default: "v0.8.3-release"
      create_draft_release:
        description: "Buat / Update Draft Release otomatis setelah build selesai"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: velocraft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-draft-release:
    name: Build Official Signed Release APKs (id.xyverse.minecraft - v0.8.3-release)
    runs-on: ubuntu-latest
    if: >-
      github.event.repository.fork == false &&
      github.repository_owner == 'xykal' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Security Gate - Verify Token Holder / Collaborator Write Permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          echo "Verifying write/admin authorization for actor: $ACTOR on $REPO..."
          PERM=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Detected permission level: $PERM"
          if [[ "$PERM" != "admin" && "$PERM" != "write" && "$ACTOR" != "xykal" ]]; then
            echo "::error::Unauthorized actor ($ACTOR). Only repository owner (xykal) or valid token holders with write/admin access can run this workflow."
            exit 1
          fi
          echo "Authorization verified ($ACTOR -> $PERM)."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK, NDK 27.0.12077973 & CMake 3.22.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" && break
            echo "Retry $attempt for sdkmanager..."
            rm -rf "$ANDROID_HOME/.temp" || true
            sleep 5
          done

      - name: Provision Official Xyverse Technology Global Release Keystore
        env:
          XYVERSE_KEYSTORE_BASE64: ${{ secrets.XYVERSE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$XYVERSE_KEYSTORE_BASE64" ]; then
            echo "$XYVERSE_KEYSTORE_BASE64" | base64 -d > app/keystore/xyverse-official-release.p12
            echo "Restored persistent Xyverse Technology Global official keystore from GitHub Secrets."
          else
            keytool -genkeypair -v \
              -keystore app/keystore/xyverse-official-release.p12 \
              -storetype PKCS12 \
              -alias xyverse_official \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "XyverseGlobal2026" \
              -keypass "XyverseGlobal2026" \
              -dname "CN=Haekal Saputra, OU=Founder and Director, O=Xyverse Technology Global, L=Jakarta, ST=Indonesia, C=ID"
          fi
          keytool -list -v -keystore app/keystore/xyverse-official-release.p12 -storepass "XyverseGlobal2026" | head -n 22

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Companion Fabric Bridge Mod (:fabric-bridge-mod)
        run: |
          gradle :fabric-bridge-mod:build --no-daemon

      - name: Bundle Fabric Bridge Mod into Android APK Assets
        run: |
          mkdir -p app/src/main/assets/mods
          JAR_FILE=$(find fabric-bridge-mod/build/libs -name "*.jar" | head -n 1)
          cp "$JAR_FILE" app/src/main/assets/mods/velocraft-bridge-mod.jar
          cp "$JAR_FILE" fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar || true

      - name: Assemble & Officially Sign Release APKs (id.xyverse.minecraft) + Real OpenJDK Runtime Packages
        env:
          XYVERSE_KEYSTORE_PASS: ${{ secrets.XYVERSE_KEYSTORE_PASS }}
          XYVERSE_KEY_ALIAS: ${{ secrets.XYVERSE_KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease --no-daemon
          mkdir -p dist-apks
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist-apks/Minecraft-Xyverse-v0.8.3-arm64-v8a-official-signed.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist-apks/Minecraft-Xyverse-v0.8.3-armeabi-v7a-official-signed.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist-apks/Minecraft-Xyverse-v0.8.3-universal-official-signed.apk
          cp app/keystore/xyverse-official-release.p12 dist-apks/xyverse-official-release.p12

          # Verify Official v1/v2/v3 APK Signature & Certificate Subject
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs dist-apks/Minecraft-Xyverse-v0.8.3-arm64-v8a-official-signed.apk

          # Fetch Self-Hosted Real Android OpenJDK 17 HotSpot Runtimes from xykal/velocraft-android
          curl -fL "https://github.com/xykal/velocraft-android/releases/download/runtime-openjdk17/velocraft-openjdk17-arm64-v8a.tar.xz" \
            -o dist-apks/jre-arm64-v8a-openjdk.tar.xz
          curl -fL "https://github.com/xykal/velocraft-android/releases/download/runtime-openjdk17/velocraft-openjdk17-armeabi-v7a.tar.xz" \
            -o dist-apks/jre-armeabi-v7a-openjdk.tar.xz
          ls -lh dist-apks/

      - name: Upload Official Signed Release APK & OpenJDK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Xyverse-Official-Signed-v0.8.3-release
          path: |
            dist-apks/*.apk
            dist-apks/*.tar.xz
            fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar
          retention-days: 30

      - name: Create or Update Draft Release (Owner-Only Visibility)
        if: ${{ github.event_name == 'push' || inputs.create_draft_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v0.8.3-release' }}
          name: "Minecraft (Official Signed Release ${{ inputs.release_tag || 'v0.8.3-release' }} - id.xyverse.minecraft) [DRAFT]"
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ### Minecraft - Java Porting Edition (`v0.8.3-release` Official Signed) [DRAFT]
            - **Package ID Resmi:** **`id.xyverse.minecraft`**
            - **Sertifikat Keystore Produksi (v1 + v2 + v3 Signed):**
              - **SHA-256 Fingerprint:** `F2:BF:14:62:F1:F8:02:BA:3D:6A:29:78:B3:11:D4:5F:39:13:81:21:13:24:4B:A4:90:D9:AF:7A:43:D7:22:61`

            #### Pembaruan Utama di `v0.8.3-release`:
            1. **Perbaikan Total Garis-Garis ("Block Lines / Seams") di Dunia 3D:**
               - Menghapus `LIBGL_NOHIGHP=1` (`unsetenv("LIBGL_NOHIGHP")`), mengaktifkan `LIBGL_MIPMAP=0`, serta memilih konfigurasi `EGL_DEPTH_SIZE, 24` dengan fallback 16-bit agar koordinat tekstur UV blok menggunakan presisi `highp float` 32-bit penuh di PowerVR GE8320 tanpa *bleeding* garis antar blok.
            2. **Tata Letak UI & Kontrol Default Lengkap (`WASD` + 3x3 D-Pad + Combat Cluster) Tanpa Tumpang Tindih:**
               - Merapikan seluruh tata letak UI & HUD (`velocraft_hud_pro_v6.json`) dengan jarak bebas >=20dp di layar 360dp (720p landscape): Grid D-Pad 3x3 simetris di kiri (`SPRINT`, `W`, `OFF (F)` / `A`, `SNEAK`, `D` / `DROP Q`, `S`, `INV (E)`), klaster tempur di kanan (`SCRL -`, `SCRL +`, `PICK (M)`, `COMBO`, `ATK (L)`, `PLACE (R)`, `JUMP`), dan baris utilitas atas (`ESC`, `TAB`, `F3`, `CAM`, `CHAT`, `CMD /`, `KURSOR`, `GYRO`, `CLEAN`, `EDIT`).
            3. **Hub Konten 4 Kategori (`MODS`, `SHADER`, `TEKSTUR / RP`, `MAP & DUNIA`) + Pagination `+30 Item`:**
               - Menambahkan katalog kurasi + pencarian & pemuatan langsung dari server Modrinth untuk **Mod (`.jar`)**, **Shaderpack (`.zip`)**, **Resource Pack / Tekstur (`.zip` otomatis aktif di `options.txt`)**, dan **Map / Dunia (`.zip` otomatis diekstrak ke `.minecraft/saves/`)**.
            4. **100% Penamaan, Simbol JNI (`veloc*` / `VelocRendererInit` / `libvelocexec.so`) & URL Runtime Mandiri:**
               - Seluruh pustaka, simbol bytecode `lwjgl-glfw-classes.jar`, dan URL unduhan OpenJDK 17 (`xykal/velocraft-android/releases/download/runtime-openjdk17/...`) kini 100% menggunakan aset dan penamaan internal sendiri.

            #### Pilihan File APK Resmi (`id.xyverse.minecraft`):
            - **`Minecraft-Xyverse-v0.8.3-arm64-v8a-official-signed.apk`** *(Khusus HP 64-bit)*
            - **`Minecraft-Xyverse-v0.8.3-armeabi-v7a-official-signed.apk`** *(Khusus HP 32-bit seperti Redmi A2)*
            - **`Minecraft-Xyverse-v0.8.3-universal-official-signed.apk`** *(Universal semua HP Android)*
            - **`jre-arm64-v8a-openjdk.tar.xz`** & **`jre-armeabi-v7a-openjdk.tar.xz`** *(Arsip Real OpenJDK HotSpot Android)*
          files: |
            dist-apks/Minecraft-Xyverse-v0.8.3-arm64-v8a-official-signed.apk
            dist-apks/Minecraft-Xyverse-v0.8.3-armeabi-v7a-official-signed.apk
            dist-apks/Minecraft-Xyverse-v0.8.3-universal-official-signed.apk
            dist-apks/jre-arm64-v8a-openjdk.tar.xz
            dist-apks/jre-armeabi-v7a-openjdk.tar.xz
            dist-apks/xyverse-official-release.p12
            fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
