name: Build Minecraft Porting Dual-ABI APK (arm64-v8a & armeabi-v7a) + Draft Release

# =======================================================================================
# SECURITY POLICY FOR PUBLIC REPO:
# 1. NO `pull_request` or `pull_request_target` triggers -> External forks CANNOT trigger builds.
# 2. Only `push` to `main` (requires write token) or manual `workflow_dispatch` (requires write/admin token).
# 3. Releases are strictly created as DRAFT (`draft: true`) so only the repo owner can review & publish.
# =======================================================================================
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag versi untuk Draft Release"
        required: false
        default: "v0.5.0-alpha"
      create_draft_release:
        description: "Buat / Update Draft Release otomatis setelah build selesai"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: velocraft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-draft-release:
    name: Build Fabric Bridge Mod + Dual-ABI Minecraft Port APKs (arm64-v8a & armeabi-v7a)
    runs-on: ubuntu-latest
    # Hard gate: block any fork execution and verify repository owner is xykal
    if: >-
      github.event.repository.fork == false &&
      github.repository_owner == 'xykal' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Security Gate — Verify Token Holder / Collaborator Write Permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          echo "Verifying write/admin authorization for actor: $ACTOR on $REPO..."
          PERM=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Detected permission level: $PERM"
          if [[ "$PERM" != "admin" && "$PERM" != "write" && "$ACTOR" != "xykal" ]]; then
            echo "::error::Unauthorized actor ($ACTOR). Only repository owner (xykal) or valid token holders with write/admin access can run this workflow."
            exit 1
          fi
          echo "Authorization verified ($ACTOR -> $PERM)."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK, NDK 27.0.12077973 & CMake 3.22.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Companion Fabric Bridge Mod (:fabric-bridge-mod)
        run: |
          gradle :fabric-bridge-mod:build --no-daemon

      - name: Bundle Fabric Bridge Mod into Android APK Assets
        run: |
          mkdir -p app/src/main/assets/mods
          JAR_FILE=$(find fabric-bridge-mod/build/libs -name "*.jar" | head -n 1)
          cp "$JAR_FILE" app/src/main/assets/mods/velocraft-bridge-mod.jar
          cp "$JAR_FILE" fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar || true

      - name: Assemble Dual-ABI Minecraft Port APKs (arm64-v8a, armeabi-v7a & universal)
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist-apks/Minecraft-Porting-v0.5.0-arm64-v8a.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk dist-apks/Minecraft-Porting-v0.5.0-armeabi-v7a.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist-apks/Minecraft-Porting-v0.5.0-universal.apk
          ls -lh dist-apks/

      - name: Upload Dual-ABI APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Porting-DualABI-v0.5.0-alpha
          path: |
            dist-apks/*.apk
            fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar
          retention-days: 30

      - name: Create or Update Draft Release (Owner-Only Visibility)
        if: ${{ github.event_name == 'push' || inputs.create_draft_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v0.5.0-alpha' }}
          name: "Minecraft (Java Porting Edition ${{ inputs.release_tag || 'v0.5.0-alpha' }} — Clean Matte UI & Resumable Downloader) [DRAFT]"
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            ### 🌿 Minecraft — Java Porting Edition (`v0.5.0-alpha`) [DRAFT]
            > **Catatan:** Release ini berstatus **Draft** (hanya terlihat oleh pemilik repo `xykal` / pemegang token dengan akses *write/admin*).

            #### ✨ Pembaruan Utama di `v0.5.0-alpha`:
            1. **Desain UI/UX & Logo Baru (100% Tanpa Neon — Clean Matte Studio Aesthetic):**
               - Mengganti seluruh warna neon dengan palet **Warm Matte Charcoal (`#141413`), Moss Green (`#4E8C57`), Terracotta (`#C87D55`), dan Alabaster (`#F4F1EA`)**.
               - Logo aplikasi baru bergaya *Matte Tactile Grass Block* yang bersih dan modern.
            2. **Main Menu Validasi Nyata (Simulasi 3D Dihapus):**
               - Menghapus simulasi 3D dan menggantinya dengan **Main Menu Console (`MainMenuView.kt`)** yang memeriksa keaslian & kelengkapan file (`client-1.20.4.jar`, ~70 *libraries*, *Fabric Loader*, 7 mod optimasi *Modrinth*, dan *Asset Index*).
               - Tombol **"MAIN SEKARANG"** hanya terbuka setelah seluruh komponen wajib tervalidasi siap.
            3. **Pilihan Ukuran Paket Data (~685 MB Lengkap vs ~245 MB Hemat):**
               - **Paket Lengkap (~685 MB):** Mengunduh seluruh library + mod + seluruh *asset objects* termasuk musik latar & *records*.
               - **Paket Hemat (~245 MB):** Mengunduh seluruh library + mod + tekstur & efek suara inti (melewati file musik latar `.ogg` berukuran besar agar hemat kuota 440 MB).
            4. **Foreground Push Notification + Floating Overlay + Auto-Resume (`HTTP Range .part`):**
               - **`EngineDownloadService.kt`:** Berjalan sebagai *Foreground Service* dengan **Push Notification** aktif (lengkap dengan tombol **Jeda / Lanjutkan**) sehingga unduhan tetap jalan walau pindah aplikasi.
               - **`FloatingDownloadOverlay.kt`:** Widget kapsul melayang di atas aplikasi lain saat izin *Display over other apps* diaktifkan.
               - **`ResumableDownloadEngine.kt`:** Mendukung **Resume per-file & per-byte (`HTTP Range: bytes=<existing>-` ke file `.part`)** sehingga jika koneksi putus atau aplikasi tertutup tidak sengaja, unduhan langsung lanjut dari posisi terakhir tanpa mengulang dari 0%.

            #### 📦 Pilihan File APK:
            - **`Minecraft-Porting-v0.5.0-arm64-v8a.apk`** *(Khusus HP 64-bit)*
            - **`Minecraft-Porting-v0.5.0-armeabi-v7a.apk`** *(Khusus HP 32-bit)*
            - **`Minecraft-Porting-v0.5.0-universal.apk`** *(Universal)*
          files: |
            dist-apks/Minecraft-Porting-v0.5.0-arm64-v8a.apk
            dist-apks/Minecraft-Porting-v0.5.0-armeabi-v7a.apk
            dist-apks/Minecraft-Porting-v0.5.0-universal.apk
            fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
