name: Build VeloCraft Android APK & Fabric Bridge

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-engine:
    name: Build Companion Fabric Mod & Android NDK APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK & NDK r27
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Companion Fabric Bridge Mod (:fabric-bridge-mod)
        run: |
          chmod +x gradlew || true
          gradle :fabric-bridge-mod:build --no-daemon

      - name: Bundle Fabric Bridge Mod into Android APK Assets
        run: |
          mkdir -p app/src/main/assets/mods
          cp fabric-bridge-mod/build/libs/velocraft-bridge-mod-*.jar app/src/main/assets/mods/velocraft-bridge-mod.jar || true

      - name: Assemble VeloCraft Android APK (arm64-v8a)
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload VeloCraft Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloCraft-Direct-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
