name: Build Minecraft Porting Dual-ABI APK (arm64-v8a & armeabi-v7a) + Draft Release

# =======================================================================================
# SECURITY POLICY FOR PUBLIC REPO:
# 1. NO `pull_request` or `pull_request_target` triggers -> External forks CANNOT trigger builds.
# 2. Only `push` to `main` (requires write token) or manual `workflow_dispatch` (requires write/admin token).
# 3. Releases are strictly created as DRAFT (`draft: true`) so only the repo owner can review & publish.
# =======================================================================================
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag versi untuk Draft Release"
        required: false
        default: "v0.4.0-alpha"
      create_draft_release:
        description: "Buat / Update Draft Release otomatis setelah build selesai"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: velocraft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-draft-release:
    name: Build Fabric Bridge Mod + Dual-ABI Minecraft Port APKs (arm64-v8a & armeabi-v7a)
    runs-on: ubuntu-latest
    # Hard gate: block any fork execution and verify repository owner is xykal
    if: >-
      github.event.repository.fork == false &&
      github.repository_owner == 'xykal' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Security Gate — Verify Token Holder / Collaborator Write Permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          echo "Verifying write/admin authorization for actor: $ACTOR on $REPO..."
          PERM=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Detected permission level: $PERM"
          if [[ "$PERM" != "admin" && "$PERM" != "write" && "$ACTOR" != "xykal" ]]; then
            echo "::error::Unauthorized actor ($ACTOR). Only repository owner (xykal) or valid token holders with write/admin access can run this workflow."
            exit 1
          fi
          echo "Authorization verified ($ACTOR -> $PERM)."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK, NDK 27.0.12077973 & CMake 3.22.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Companion Fabric Bridge Mod (:fabric-bridge-mod)
        run: |
          gradle :fabric-bridge-mod:build --no-daemon

      - name: Bundle Fabric Bridge Mod into Android APK Assets
        run: |
          mkdir -p app/src/main/assets/mods
          JAR_FILE=$(find fabric-bridge-mod/build/libs -name "*.jar" | head -n 1)
          cp "$JAR_FILE" app/src/main/assets/mods/velocraft-bridge-mod.jar
          cp "$JAR_FILE" fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar || true

      - name: Assemble Dual-ABI Minecraft Port APKs (arm64-v8a, armeabi-v7a & universal)
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist-apks/Minecraft-Porting-v0.4.0-arm64-v8a.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk dist-apks/Minecraft-Porting-v0.4.0-armeabi-v7a.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist-apks/Minecraft-Porting-v0.4.0-universal.apk
          ls -lh dist-apks/

      - name: Upload Dual-ABI APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Porting-DualABI-v0.4.0-alpha
          path: |
            dist-apks/*.apk
            fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar
          retention-days: 30

      - name: Create or Update Draft Release (Owner-Only Visibility)
        if: ${{ github.event_name == 'push' || inputs.create_draft_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v0.4.0-alpha' }}
          name: "Minecraft (Java Porting Edition ${{ inputs.release_tag || 'v0.4.0-alpha' }} — arm64-v8a & armeabi-v7a) [DRAFT]"
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            ### ⚡ Minecraft — Java Porting Edition (`v0.4.0-alpha`) [DRAFT]
            > **Catatan:** Release ini berstatus **Draft** (hanya terlihat oleh pemilik repo `xykal` / pemegang token dengan akses *write/admin*).

            #### 🛠️ Perbaikan Utama & Fitur Baru di `v0.4.0-alpha`:
            - **Nama Aplikasi & Logo Baru:** Nama aplikasi di HP kini **`Minecraft`** dengan edisi internal *Java Porting Edition*, lengkap dengan **Logo Kustom HD** (`mipmap-mdpi` s/d `mipmap-xxxhdpi` + *roundIcon*).
            - **Perbaikan Crash Saat Buka Aplikasi (Force Close Fix):**
              1. Memperbaiki urutan pemanggilan `window.insetsController` pada Android 11–15 yang sebelumnya dipanggil sebelum `setContentView()` (penyebab utama `NullPointerException` saat startup).
              2. Mengganti `ArrayDeque.removeFirst()/addLast()` (yang bentrok dengan bytecode `SequencedCollection` JDK 21 pada Android 7–14) dengan `ArrayList` yang kompatibel di semua versi Android.
              3. Mengubah linkage NDK menjadi `-DANDROID_STL=c++_static` agar `libvelocraft_bridge.so` mandiri tanpa ketergantungan `.so` eksternal.
              4. Menambahkan `VoxelWorldView` interaktif 120 FPS sebagai viewport cadangan saat `libjli.so` belum dipasang.
            - **Sistem Log Otomatis ke `/storage/emulated/0/Android/media/io.velocraft.android/log/`:**
              - Otomatis menulis **`latest.log`** dan **`crash.log`** di folder `Android/media/io.velocraft.android/log/` (bisa dibuka langsung lewat ZArchiver / File Manager tanpa root, atau dilihat langsung dari tombol **⚙ CFG -> 📄 Lihat Log** di dalam game).

            #### 📦 Pilihan File APK:
            1. **`Minecraft-Porting-v0.4.0-arm64-v8a.apk`** — Khusus HP **64-bit (`arm64-v8a`)**.
            2. **`Minecraft-Porting-v0.4.0-armeabi-v7a.apk`** — Khusus HP **32-bit (`armeabi-v7a`)**.
            3. **`Minecraft-Porting-v0.4.0-universal.apk`** — Versi **Universal** (`arm64-v8a` + `armeabi-v7a`).
          files: |
            dist-apks/Minecraft-Porting-v0.4.0-arm64-v8a.apk
            dist-apks/Minecraft-Porting-v0.4.0-armeabi-v7a.apk
            dist-apks/Minecraft-Porting-v0.4.0-universal.apk
            fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
