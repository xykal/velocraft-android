name: Build Minecraft Porting Dual-ABI APK (arm64-v8a & armeabi-v7a) + OpenJDK Runtime + Draft Release

# =======================================================================================
# SECURITY POLICY FOR PUBLIC REPO:
# 1. NO `pull_request` or `pull_request_target` triggers -> External forks CANNOT trigger builds.
# 2. Only `push` to `main` (requires write token) or manual `workflow_dispatch` (requires write/admin token).
# 3. Releases are strictly created as DRAFT (`draft: true`) so only the repo owner can review & publish.
# =======================================================================================
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag versi untuk Draft Release"
        required: false
        default: "v0.6.0-alpha"
      create_draft_release:
        description: "Buat / Update Draft Release otomatis setelah build selesai"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: velocraft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-draft-release:
    name: Build Fabric Bridge Mod + Dual-ABI Minecraft Port APKs + OpenJDK Runtime Bundles
    runs-on: ubuntu-latest
    if: >-
      github.event.repository.fork == false &&
      github.repository_owner == 'xykal' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Security Gate - Verify Token Holder / Collaborator Write Permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          echo "Verifying write/admin authorization for actor: $ACTOR on $REPO..."
          PERM=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "Detected permission level: $PERM"
          if [[ "$PERM" != "admin" && "$PERM" != "write" && "$ACTOR" != "xykal" ]]; then
            echo "::error::Unauthorized actor ($ACTOR). Only repository owner (xykal) or valid token holders with write/admin access can run this workflow."
            exit 1
          fi
          echo "Authorization verified ($ACTOR -> $PERM)."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK, NDK 27.0.12077973 & CMake 3.22.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Companion Fabric Bridge Mod (:fabric-bridge-mod)
        run: |
          gradle :fabric-bridge-mod:build --no-daemon

      - name: Bundle Fabric Bridge Mod into Android APK Assets
        run: |
          mkdir -p app/src/main/assets/mods
          JAR_FILE=$(find fabric-bridge-mod/build/libs -name "*.jar" | head -n 1)
          cp "$JAR_FILE" app/src/main/assets/mods/velocraft-bridge-mod.jar
          cp "$JAR_FILE" fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar || true

      - name: Assemble Dual-ABI Minecraft Port APKs & Package OpenJDK 21 Runtime Zips (Opsi A)
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist-apks/Minecraft-Porting-v0.6.0-arm64-v8a.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk dist-apks/Minecraft-Porting-v0.6.0-armeabi-v7a.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist-apks/Minecraft-Porting-v0.6.0-universal.apk

          # Package Opsi A OpenJDK Runtime Zips (jre21-arm64-v8a-runtime.zip & jre21-armeabi-v7a-runtime.zip)
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "runtime-pkg-$ABI/lib"
            JLI_SO=$(find app/build/intermediates -path "*$ABI*" -name "libjli_embedded.so" | head -n 1)
            BRIDGE_SO=$(find app/build/intermediates -path "*$ABI*" -name "libvelocraft_bridge.so" | head -n 1)
            cp "$JLI_SO" "runtime-pkg-$ABI/lib/libjli.so"
            cp "$BRIDGE_SO" "runtime-pkg-$ABI/lib/libvelocraft_bridge.so"
            (cd "runtime-pkg-$ABI" && zip -r "../dist-apks/jre21-$ABI-runtime.zip" lib/)
          done
          ls -lh dist-apks/

      - name: Upload Dual-ABI APK & Runtime Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Porting-DualABI-v0.6.0-alpha
          path: |
            dist-apks/*.apk
            dist-apks/*.zip
            fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar
          retention-days: 30

      - name: Create or Update Draft Release (Owner-Only Visibility)
        if: ${{ github.event_name == 'push' || inputs.create_draft_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v0.6.0-alpha' }}
          name: "Minecraft (Java Porting Edition ${{ inputs.release_tag || 'v0.6.0-alpha' }} - Custom Canvas UI, Multi-Renderer & OpenJDK 21) [DRAFT]"
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            ### Minecraft - Java Porting Edition (`v0.6.0-alpha`) [DRAFT]
            > **Catatan:** Release ini berstatus **Draft** (hanya terlihat oleh pemilik repo `xykal` / pemegang token dengan akses *write/admin*).

            #### Pembaruan Utama di `v0.6.0-alpha`:
            1. **100% Custom Canvas UI (Tanpa UI Bawaan Android & 0% Emoji):**
               - Menghapus seluruh komponen UI bawaan Android (`AlertDialog`, `Toast`, `SeekBar`, `Switch`, `EditText`) dan menggantinya dengan **`CustomCanvasModalView.kt`** (4 Tab: *Renderer & Account*, *Controls & Cursor*, *Custom Keybind & HUD*, serta *Diagnostic Log*).
               - 0% Emoji di seluruh UI, tombol HUD, notifikasi, maupun file log.
            2. **Bundled OpenJDK 21 Runtime (`Opsi A`) + Silent-OGG Safe Lite Mode:**
               - Menyertakan paket `jre21-arm64-v8a-runtime.zip` & `jre21-armeabi-v7a-runtime.zip` serta `libjli_embedded.so` terintegrasi sehingga tidak pernah tertahan di *"menunggu pemasangan openjdk runtime"*.
               - **Mode Hemat (~245 MB):** Membuat stub `.ogg` hening berukuran 108-byte yang 100% valid untuk file musik latar sehingga `SoundEngine` Minecraft tidak akan pernah error atau berhenti.
            3. **All-Device Multi-Renderer (Auto-Match) + Iris Shaders Support:**
               - Mendukung mode **`AUTO (Match Device GPU)`** serta pilihan manual **`GL4ES 1.1.5`**, **`MobileGlues GLES 3.2`**, **`LTW`**, dan **`Zink Vulkan`**.
               - Mendukung **Shader** via mod **Iris Shaders** + sinkronisasi otomatis file `.zip` shader dari `/storage/emulated/0/Android/media/io.velocraft.android/shaderpacks/`.
            4. **Show Virtual Cursor + Bebas Custom HUD (Semua Tombol Keyboard PC & Gamepad):**
               - Tombol **`CURSOR`** di HUD untuk menampilkan/menyembunyikan kursor mouse virtual kapan saja.
               - Kebebasan penuh menambah/menghapus tombol HUD dan melakukan *binding* ke **seluruh tombol Keyboard PC (`A-Z`, `0-9`, `F1-F12`, `SPACE`, `SHIFT`, `CTRL`, `ALT`, `TAB`, `ARROW`)** serta dukungan penuh **Gamepad/Controller Bluetooth & USB (`GamepadInputRouter.kt`)**.
            5. **Log Diagnostik Lebih Jelas:**
               - Format log terstruktur per kategori (`[BOOT]`, `[RENDERER]`, `[DOWNLOAD]`, `[RUNTIME]`, `[INPUT]`, `[CRASH]`) di `/storage/emulated/0/Android/media/io.velocraft.android/log/`.

            #### Pilihan File APK & Runtime:
            - **`Minecraft-Porting-v0.6.0-arm64-v8a.apk`** *(Khusus HP 64-bit)*
            - **`Minecraft-Porting-v0.6.0-armeabi-v7a.apk`** *(Khusus HP 32-bit)*
            - **`Minecraft-Porting-v0.6.0-universal.apk`** *(Universal)*
            - **`jre21-arm64-v8a-runtime.zip`** & **`jre21-armeabi-v7a-runtime.zip`**
          files: |
            dist-apks/Minecraft-Porting-v0.6.0-arm64-v8a.apk
            dist-apks/Minecraft-Porting-v0.6.0-armeabi-v7a.apk
            dist-apks/Minecraft-Porting-v0.6.0-universal.apk
            dist-apks/jre21-arm64-v8a-runtime.zip
            dist-apks/jre21-armeabi-v7a-runtime.zip
            fabric-bridge-mod/build/libs/velocraft-bridge-mod-0.1.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
